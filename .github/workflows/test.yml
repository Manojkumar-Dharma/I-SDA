# E7e: compile, the full suite split into shards (one job each), and the keyword-index check, on every push to main
# and every pull request. The shards are `node src/test/run.js --shard I/N`: together exactly the files of a plain
# run, each once. When you change the number of shards, change the matrix and nothing else.
#
# The shared-worker / one-process-per-file parity check (`npm run test:parity`) runs the suite twice, so it is a
# separate job that runs weekly and on request, not on every push.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      control:
        description: 'Also time the old way (one process per file, one job, no page reuse) on a runner, to compare with the four shards'
        type: boolean
        default: false
  schedule:
    - cron: '17 3 * * 1'

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  keyword-index:
    name: Keyword index is up to date
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node docs/sda-reference/keyword-index/generate_keyword_index.js --check

  suite:
    name: Suite, shard ${{ matrix.shard }}
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/4', '2/4', '3/4', '4/4']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run compile
      - name: Run shard ${{ matrix.shard }}
        shell: bash
        run: node src/test/run.js --shard ${{ matrix.shard }} 2>&1 | tee shard.log
      # The job log is not readable from outside GitHub; annotations are, so say which files failed there too.
      - name: Say which files failed
        if: failure()
        shell: bash
        run: grep -E '^\*\*\* |^FAIL ' shard.log | head -30 | while IFS= read -r line; do echo "::error::${line}"; done

  parity:
    name: Shared worker and one process per file agree
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm run test:parity

  # E7f target 2: the full suite the way it ran before E7, on the same kind of runner as the four shards above.
  # Manual only (run with "control" ticked); the figure to compare with is the slowest shard job's total time.
  control:
    name: Control, old way on one job
    if: github.event_name == 'workflow_dispatch' && inputs.control
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run compile
      - name: Old way, timed
        shell: bash
        run: |
          start=$(date +%s)
          ISDA_NO_PAGE_REUSE=1 ISDA_JOBS=1 node src/test/run.js --isolate --jobs 1 2>&1 | tee control.log | tail -15
          echo "control wall seconds: $(( $(date +%s) - start ))" | tee -a "$GITHUB_STEP_SUMMARY"
